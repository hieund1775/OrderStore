        - Group Checkout
        - Reconciliation
        - VietQR
      summary: Universal Payment Status & Reconciliation
      description: >-
        Tra cứu trạng thái thanh toán theo mã đơn hàng hoặc mã nhóm GRP...

        Tự động đối soát trực tiếp với PayOS (reconcilePayOSOrder / reconcilePayOSCheckoutGroup) nếu đơn đang ở trạng thái unpaid/expired.

        Hỗ trợ guest customer với header x-cancel-token hoặc query cancel_token.
      parameters:
        - name: code
          in: query
          required: true
          description: Order code (e.g. TP-1024) or Grouped checkout code (e.g.
            GRP260920XYZ)
          schema:
            type: string
        - name: cancel_token
          in: query
          required: false
          description: Guest cancel token for unauthenticated lookup
          schema:
            type: string
        - $ref: "#/components/parameters/CancelTokenHeader"
      responses:
        "200":
          description: Current payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResult"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order or grouped checkout not found
          content:
            application/json:
              schema:
