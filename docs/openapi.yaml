        - Health
      summary: Root Health Check
      description: Reports API runtime status, service name, server timestamp, and uptime.
      responses:
        "200":
          description: API operational
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /live:
    get:
      tags:
        - Health
      summary: Liveness Probe
      description: Kubernetes / Render liveness probe verifying event loop
        responsiveness without database dependency.
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ready:
    get:
      tags:
        - Health
      summary: Readiness Probe
      description: Readiness probe verifying PostgreSQL connection pool health with a
        3-second timeout.
      responses:
        "200":
          description: Database connected and service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "400":
          description: Validation or business rule error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server or database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database connection failed or timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        message:
          type: string
          example: TeaPlus API (PostgreSQL)
        uptime:
          type: integer
          example: 3600
        timestamp:
          type: string
          format: date-time
      required:
        - status
    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
          example: ready
        database:
          type: string
          example: connected
      required:
        - status
    RuntimeBuild:
      type: object
      properties:
        reviewsContract:
          type: string
          example: v1-object
        buildMarker:
          type: string
          example: reviews-runtime-provenance-20260909
      required:
        - reviewsContract
        - buildMarker
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message in Vietnamese or English
        code:
          type: string
          description: Machine-readable business error code (optional)
      required:
        - error
    AuthLoginInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
          description: Vietnamese 10-digit mobile phone number
        password:
          type: string
          format: password
          example: Password123
      required:
        - phone
        - password
    AdminLoginInput:
      type: object
      properties:
        username:
          type: string
          example: admin
          description: Staff username or admin identifier
        phone:
          type: string
          example: "0901234567"
          description: Staff phone number (alternative login identifier)
        password:
          type: string
          format: password
          example: SecurePass123
      required:
        - password
    CustomerRegisterInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
        password:
          type: string
          format: password
          example: Password123
        fullname:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          format: email
          example: nguyenvana@example.com
        address:
          type: string
          example: 123 Đường Hoa Lan, Phường 2, Phú Nhuận
      required:
        - phone
        - password
        - fullname
    SendOtpInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
        purpose:
          type: string
          example: register
          enum:
            - register
            - forgot_password
            - auth
      required:
        - phone
    VerifyOtpInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
        otp:
          type: string
          example: "123456"
        purpose:
          type: string
          example: register
      required:
        - phone
        - otp
    GoogleAuthInput:
      type: object
      properties:
        idToken:
          type: string
          description: Google Identity OAuth credential / ID token
      required:
        - idToken
    ForgotPasswordVerifyPhoneInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
      required:
        - phone
    ForgotPasswordSendOtpInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
      required:
        - phone
    ForgotPasswordResetInput:
      type: object
      properties:
        phone:
          type: string
          example: "0901234567"
        otp:
          type: string
          example: "123456"
        newPassword:
          type: string
          format: password
          example: NewSecret123
      required:
        - phone
        - otp
        - newPassword
    SendEmailOtpInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
      required:
        - email
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: customer@example.com
        otp:
          type: string
          example: "123456"
      required:
        - email
        - otp
    StaffInvitationAcceptInput:
      type: object
      properties:
        token:
          type: string
          description: Onboarding invitation token received via email/admin
        password:
          type: string
          format: password
          example: StaffSecure123
        fullname:
          type: string
          example: Trần Văn Nhân Viên
      required:
        - token
        - password
    CustomerProfile:
      type: object
      properties:
        id:
          type: integer
          example: 101
        phone:
          type: string
          example: "0901234567"
        fullname:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          format: email
          example: user@example.com
        avatar_url:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        tier:
          type: string
          example: Đồng
        points:
          type: integer
          example: 120
        total_spent:
          type: number
          example: 450000
        total_orders:
          type: integer
          example: 6
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
    StaffProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: manager_pn
        fullname:
          type: string
          example: Quản Lý Chi Nhánh
        role:
          type: string
          enum:
            - super
            - manager
            - cashier
            - kitchen
            - packing
        branch_id:
          type: integer
          nullable: true
          example: 2
        branch_name:
          type: string
          nullable: true
          example: Chi nhánh Phú Nhuận
        is_active:
          type: boolean
          example: true
    CreateOrderItemInput:
      type: object
      properties:
        product_id:
          type: integer
          example: 1
        variant_id:
          type: integer
          nullable: true
          example: 10
        quantity:
          type: integer
          minimum: 1
          default: 1
        unit_price:
          type: number
          example: 35000
        size:
          type: string
          example: M
        sugar:
          type: string
          example: 70%
        ice:
          type: string
          example: 50%
        toppings:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
                example: Trân châu trắng
              price:
                type: number
                example: 8000
      required:
        - product_id
        - quantity
    CreateOrderInput:
      type: object
      properties:
        source:
          type: string
          enum:
            - online
            - pos
            - table_qr
          default: online
        order_type:
          type: string
          enum:
            - Take-away
            - Delivery
            - POS
            - Dine-in
          default: Take-away
        payment_method:
          type: string
          enum:
            - VietQR
            - COD
            - MoMo
            - ZaloPay
          default: VietQR
        store_id:
          type: integer
          example: 1
