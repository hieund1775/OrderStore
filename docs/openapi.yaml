  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authorization header using Bearer scheme (e.g. "Bearer
        {token}"). Staff and customer endpoints enforce signature and token
        version verification.
  parameters:
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: false
      description: Unique client-supplied UUID or request key ensuring safe
        exactly-once execution and mutation replays.
