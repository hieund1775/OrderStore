openapi: 3.1.0
info:
  title: TeaPlus Order & Store Management API
  version: 1.0.0
  description: Toàn bộ HTTP API routes cho hệ thống TeaPlus — Tiệm Trà Vườn Xanh,
    bao gồm luồng đặt hàng online, gọi món tại quầy (POS), đặt bàn & cọc tiệc
    trước (Preorder), màn hình bếp (KDS), khu vực đóng gói (Packing lane), cổng
    thanh toán PayOS / VietQR đa ngành hàng (Grouped Checkout), đối soát thanh
    toán (Reconciliation) và quản trị vận hành.
servers:
  - url: "{base_url}"
    description: Dynamic Base URL (Production / Staging / Test)
    variables:
      base_url:
        default: https://teaplus-order-backend.onrender.com
        description: Production or Staging backend URL
  - url: http://localhost:5000
    description: Local Node.js Development Server
tags:
  - name: Health
    description: System health, liveness, readiness, and runtime build metadata probes
  - name: Auth
    description: Customer & staff authentication, OTP verification, password reset,
      and session identity
  - name: Payments
    description: Universal payment status, QR regeneration, PayOS gateway
      integration & sandbox
  - name: Payment Profiles
    description: Multi-industry merchant profile configurations & root category key bindings
  - name: Group Checkout
    description: Multi-industry checkout aggregation, split order generation, and
      unified payment links
  - name: VietQR
    description: VietQR payment code generation, polling status, and QR renewal
  - name: Webhooks
    description: Asynchronous payment settlement callbacks from PayOS
  - name: Reconciliation
    description: Automated & manual payment reconciliation, transaction dispute
      resolution, and settlement audits
  - name: Orders
    description: Customer order creation, guest lookup, status tracking, and cancellation
  - name: Preorders
    description: Preorder reservations, table slot availability, deposit checkout,
      and customer check-in
  - name: Admin
    description: Internal store management, staff privileges, operations, and auditing
  - name: POS
    description: In-store point of sale counter orders with branch-scoped cashier execution
  - name: Kitchen (KDS)
    description: Real-time kitchen display system queues and order line task status
  - name: Fulfillment
    description: Dual-lane fulfillment tasks (Kitchen & Packing lanes) and shipper handovers
  - name: Catalog
    description: Multi-level categories, dynamic attributes, variants, presets, and
      public menu display
  - name: Inventory
    description: Ingredient tracking, SKU variant stock levels, adjustments, and
      branch-specific offers
  - name: Stores & Tables
    description: Physical store branches, dining tables, and table-side QR security tokens
  - name: Promotions & Vouchers
    description: Discount campaigns, voucher validation, and order settlement discounts
  - name: Reviews
    description: Customer product reviews, media attachments, admin moderation, and
      public display
  - name: Recruitment
    description: Career openings and candidate application lifecycle management
  - name: Customers & Engagement
    description: Customer loyalty tiers, points reward redemptions, wishlists, and
      notifications
  - name: Reports & Dashboard
    description: Real-time business performance KPIs, revenue distribution, and
      operational metrics
  - name: Admin Settings
    description: Staff accounts, role assignments, invitation onboarding, and system
      audit logs
  - name: Admin Notifications
    description: Staff incident notifications, system alerts, and broadcasts
