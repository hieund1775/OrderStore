services:
  # ═══════════════════════════════════════════════════════════════════
  # 1. Primary Backend API Web Service
  # ═══════════════════════════════════════════════════════════════════
  - type: web
    name: teaplus-order-backend
    runtime: node
    plan: free
    region: singapore # sin region closest to Vietnam for low latency
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm run db:pg:migrate && npm start
    healthCheckPath: /ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false # Set securely in Render Dashboard (Supabase PostgreSQL pooler URL)
      - key: PGSSLMODE
        value: require
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: PG_POOL_MAX
        value: "10"
      - key: PG_IDLE_TIMEOUT
        value: "30000"
      - key: PG_CONNECT_TIMEOUT
        value: "5000"
      - key: TRUST_PROXY
        value: "true"
      - key: FRONTEND_URL
        sync: false # e.g. https://teaplus.vn,https://admin.teaplus.vn
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENABLE_API_DOCS
        value: "false" # Disabled by default in production
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false # https://<frontend-render-url>/theo-doi-don
      - key: PAYOS_CANCEL_URL
        sync: false # https://<frontend-render-url>/thanh-toan
      - key: PAYOS_PAYMENT_TIMEOUT_MINUTES
        value: "15"
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ═══════════════════════════════════════════════════════════════════
  # 2. Frontend Web Service (TanStack Start SSR)
  # ═══════════════════════════════════════════════════════════════════
  - type: web
    name: teaplus-order-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        sync: false # Set to the deployed backend URL in Render Dashboard
      - key: VITE_STANDALONE
        value: "false"

  # ═══════════════════════════════════════════════════════════════════
  # 3. PayOS Order Expiry Cron Job (Runs every 5 minutes)
  # ═══════════════════════════════════════════════════════════════════
  - type: cron
    name: teaplus-payos-expiry-cron
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: npm install --omit=dev
    startCommand: node commands/expire-payos-orders.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "false"
